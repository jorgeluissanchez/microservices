  namespace: microservices
spec:
  serviceName: postgres-reservation
  replicas: 1
  selector:
    matchLabels:
      app: postgres-reservation
  template:
    metadata:
      labels:
        app: postgres-reservation
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: reservation_db
            - name: POSTGRES_USER
              value: reservation_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: RESERVATION_POSTGRES_PASSWORD
          volumeMounts:
            - name: reservation-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: reservation-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-reservation
  namespace: microservices
spec:
  selector:
    app: postgres-reservation
  ports:
    - port: 5432
