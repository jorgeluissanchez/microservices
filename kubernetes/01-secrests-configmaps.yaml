# 🔒 Secrets: contraseñas y llaves
apiVersion: v1
kind: Secret
metadata:
  name: microservices-secrets
  namespace: microservices
type: Opaque
stringData:
  JWT_SECRET: supersecretjwtkey
  AUTH_MONGO_PASSWORD: password123
  PAYMENT_POSTGRES_PASSWORD: paymentpass
  RESERVATION_POSTGRES_PASSWORD: reservationpass

---
# ⚙️ ConfigMaps: configuración por microservicio
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: microservices
data:
  PORT: "3001"
  MONGO_URI: "mongodb://root:password123@mongo:27017/microservices?authSource=admin"
  JWT_EXPIRATION: "3600"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: microservices
data:
  PORT: "3002"
  POSTGRES_HOST: "postgres-payment"
  POSTGRES_DB: "payment_db"
  POSTGRES_USER: "payment_user"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reservation-config
  namespace: microservices
data:
  PORT: "3003"
  POSTGRES_HOST: "postgres-reservation"
  POSTGRES_DB: "reservation_db"
  POSTGRES_USER: "reservation_user"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: microservices
data:
  PORT: "3000"
  AUTH_SERVICE_URL: "http://auth:3001"
  PAYMENT_SERVICE_URL: "http://payment:3002"
  RESERVATION_SERVICE_URL: "http://reservation:3003"
