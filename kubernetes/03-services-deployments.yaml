# PAYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: payment:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: payment-config
            - secretRef:
                name: microservices-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: microservices
spec:
  selector:
    app: payment
  ports:
    - port: 3002

