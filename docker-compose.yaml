services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: microservices-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - microservices-network

  # Kafka for messaging
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: microservices-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - microservices-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: microservices-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - microservices-network

  # Places Service
  places-service:
    build:
      context: ./places
      dockerfile: Dockerfile
    container_name: microservices-places
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/places_db?authSource=admin
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - microservices-network

  # Auth Service
  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: microservices-auth
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/auth_db?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key-here
      - JWT_EXPIRATION=24h
      - HTTP_PORT=3000
      - TCP_PORT=3001
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - microservices-network

  # Reservations Service
  reservations-service:
    build:
      context: ./reservation
      dockerfile: Dockerfile
    container_name: microservices-reservations
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/reservations_db?authSource=admin
      - PAYMENT_SERVICE_URL=http://payment-service:3002
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - microservices-network

  # Payment Service
  payment-service:
    build:
      context: ./payment
      dockerfile: Dockerfile
    container_name: microservices-payment
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/payments_db?authSource=admin
      - STRIPE_SECRET_KEY=
      - FRONTEND_URL=http://localhost:3005
      - RESERVATION_SERVICE_URL=http://reservations-service:3003
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - microservices-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: microservices-api-gateway
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - AUTH_SERVICE_URL=http://auth-service:3000
      - PLACES_SERVICE_URL=http://places-service:3001
      - PAYMENT_SERVICE_URL=http://payment-service:3002
      - RESERVATION_SERVICE_URL=http://reservations-service:3003
      - JWT_SECRET=your-super-secret-jwt-key-here
      - NODE_ENV=production
    depends_on:
      - auth-service
      - places-service
      - payment-service
      - reservations-service
    networks:
      - microservices-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microservices-frontend
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
    networks:
      - microservices-network

volumes:
  mongodb_data:


networks:
  microservices-network:
    driver: bridge
